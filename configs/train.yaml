# Classifier training configuration
# Use with: python scripts/train_classifier.py --config configs/data.yaml configs/train.yaml

train:
  model_type: embedding_head  # "embedding_head" or "setfit"
  encoder: BAAI/bge-base-en-v1.5
  train_data: data/generated/train.jsonl
  test_data: data/generated/test.jsonl
  output_dir: output/models

  # Embedding head parameters
  hidden_dim: 256
  dropout: 0.1
  learning_rate: 0.001
  epochs: 20
  batch_size: 64

  # SetFit parameters (used when model_type=setfit)
  setfit_num_iterations: 20
  setfit_num_epochs: 1

runtime:
  device: auto

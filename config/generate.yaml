# Generation-specific configuration for Vista (TACC)
# Use with: python -m cip_classifier generate -c config/default.yaml -c config/generate.yaml
#
# The server_url is written by slurm/launch_server.sbatch at runtime.
# Override with --set generate.server_url=http://<node>:30000 if needed.

generate:
  model: deepseek-ai/DeepSeek-R1
  server_url: http://localhost:30000
  temperature: 0.6
  max_tokens: 1024
  samples_per_field: 10
  batch_size: 16
  seed: 42
